rules:
  # Bronze
  action-setup: done  # no custom actions
  appropriate-polling: done  # 5 minutes by default, user configurable
  brands: todo  # needs a PR against home-assistant/brands
  common-modules: done  # coordinator.py, entity.py, model.py
  config-flow: done
  config-flow-test-coverage: done  # tests/test_config_flow.py
  dependency-transparency: done  # no third-party requirements
  docs-actions: done  # no actions
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done  # polling only, no subscriptions
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done  # entry.runtime_data
  test-before-configure: done  # the flow logs in before creating the entry
  test-before-setup: done  # async_config_entry_first_refresh
  unique-config-entry: done  # unique_id is the Schulmanager user id

  # Silver
  action-exceptions: done  # no actions
  config-entry-unloading: done
  docs-configuration-parameters: done  # update interval, documented in the README
  docs-installation-parameters: done
  entity-unavailable: done  # entities drop out with the student
  integration-owner: done
  log-when-unavailable: done  # via DataUpdateCoordinator
  parallel-updates: todo
  reauthentication-flow: done  # password entries; SSO entries need re-adding
  test-coverage: todo  # sensor and calendar platforms are not covered yet

  # Gold
  devices: done  # one device per student
  diagnostics: todo
  discovery: exempt  # a cloud account cannot be discovered
  discovery-update-info: exempt  # no discovery
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: done  # two-factor accounts, teacher logins
  docs-supported-devices: exempt  # not a device integration
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo  # a newly enrolled sibling needs a reload
  entity-category: done
  entity-device-class: done  # timestamps
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo  # options flow covers the interval; credentials still need reauth
  repair-issues: exempt  # nothing the user can repair in place
  stale-devices: todo  # a departed student's device is not removed

  # Platinum
  async-dependency: done  # aiohttp throughout
  inject-websession: done  # async_get_clientsession
  strict-typing: todo
