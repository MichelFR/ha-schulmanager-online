# Ready-to-apply automations for the Schulmanager Online integration.
#
# Replace <PREFIX> with the student's entity prefix, which Home Assistant
# derives from the device name (the student's full name). Check the real value
# in Developer Tools → States after adding the integration; on a non-English
# instance the entity names may be localised.
#
# Devices used here:
#   notify.mobile_app_iphone_16_von_enrique     (iPhone)
#   notify.mobile_app_ipad_air_m4_von_enrique   (tablet)
#
# Live Activities need iOS 17.2+, HA Core 2026.7+, and the feature enabled once
# in the companion app under Settings → Live Activities. They are NOT available
# on iPad — an Apple limitation — so that automation targets the iPhone only.

# --------------------------------------------------------------------------- #
# 1. One Live Activity for the whole school day, with a progress bar
# --------------------------------------------------------------------------- #
- id: schulmanager_live_activity_aktuelle_stunde
  alias: "Benachrichtigungen: Schulmanager aktuelle Stunde Live Activity"
  description: >-
    Eine einzige Live-Aktivität für den ganzen Schultag: Fortschrittsbalken der
    laufenden Stunde plus Countdown bis zum Stundenende. In den Pausen wird sie
    NICHT beendet, sondern auf die nächste Stunde umgestellt. Beendet wird erst
    nach Schulschluss.
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.<PREFIX>_current_lesson
      id: zustand
    - trigger: state
      entity_id: binary_sensor.<PREFIX>_at_school
      id: zustand
    - trigger: time_pattern
      minutes: /5
      id: tick
      note: "progress only moves when pushed, so it has to be nudged"
  conditions:
    # The five-minute tick only matters during school hours; a state change
    # always matters, including the one that ends the day.
    - condition: or
      conditions:
        - condition: trigger
          id: zustand
        - condition: state
          entity_id: binary_sensor.<PREFIX>_at_school
          state: "on"
  actions:
    - variables:
        stunde: sensor.<PREFIX>_current_lesson
        naechste: sensor.<PREFIX>_next_lesson
        live_activity_tag: schulmanager_stunde
    # A separate step: a variables block renders its keys one at a time, and
    # these need the ones above.
    - variables:
        fortschritt: >-
          {% set s = state_attr(stunde,'start') %}{% set e = state_attr(stunde,'end') %}
          {%- if s and e %}{% set gesamt = as_timestamp(e) - as_timestamp(s) %}
          {%- if gesamt > 0 %}{{ [[ ((as_timestamp(now()) - as_timestamp(s)) / gesamt * 100) | round(0) | int, 0 ] | max, 100 ] | min }}
          {%- else %}0{% endif %}{% else %}0{% endif %}
        restzeit: >-
          {% set ziel = state_attr(stunde,'end') or state_attr(naechste,'start') %}
          {%- if ziel %}{{ [0, (as_timestamp(ziel) - as_timestamp(now())) | int(0)] | max }}{% else %}0{% endif %}
    - choose:
        - alias: "Unterricht läuft"
          conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: sensor.<PREFIX>_current_lesson
                  state:
                    - unknown
                    - unavailable
          sequence:
            - action: notify.mobile_app_iphone_16_von_enrique
              data:
                title: "Stundenplan"
                message: >-
                  {{ states(stunde) }}
                  {%- set raum = state_attr(stunde,'room') %}
                  {%- if raum %} · {{ raum }}{% endif %}
                  {%- if state_attr(stunde,'is_substitution') %} · Vertretung{% endif %}
                data:
                  tag: "{{ live_activity_tag }}"
                  live_update: true
                  critical_text: "{{ state_attr(stunde,'class_hour') }}. Std"
                  progress: "{{ fortschritt }}"
                  progress_max: 100
                  progress_bar_color: "#4CAF50"
                  progress_bar_direction: increasing
                  chronometer: true
                  when: "{{ restzeit }}"
                  when_relative: true
                  notification_icon: mdi:school
                  silent: true
                  alert_once: true
                  url: /lovelace/schule
        - alias: "Pause — Activity behalten"
          conditions:
            - condition: state
              entity_id: binary_sensor.<PREFIX>_at_school
              state: "on"
          sequence:
            - action: notify.mobile_app_iphone_16_von_enrique
              data:
                title: "Stundenplan"
                message: >-
                  Pause
                  {%- if states(naechste) not in ['unknown','unavailable'] %} · danach {{ states(naechste) }}
                  {%- set raum = state_attr(naechste,'room') %}{% if raum %} in {{ raum }}{% endif %}{% endif %}
                data:
                  tag: "{{ live_activity_tag }}"
                  live_update: true
                  critical_text: "Pause"
                  chronometer: true
                  when: "{{ restzeit }}"
                  when_relative: true
                  notification_icon: mdi:coffee
                  silent: true
                  alert_once: true
                  url: /lovelace/schule
      default:
        - alias: "Schule vorbei"
          note: "the only place it ends, so one push-to-start per day"
          action: notify.mobile_app_iphone_16_von_enrique
          data:
            message: clear_notification
            data:
              tag: "{{ live_activity_tag }}"

# --------------------------------------------------------------------------- #
# 2. Silent, Focus-breaking alert for substitutions and cancellations
# --------------------------------------------------------------------------- #
- id: schulmanager_planabweichung
  alias: "Schulmanager: Vertretung oder Ausfall"
  description: >-
    Meldet Vertretungen und ausgefallene Stunden für heute und morgen.
    interruption-level time-sensitive durchbricht Fokus/Nicht stören,
    sound none macht die Meldung lautlos. (Ein echtes "critical" wäre
    nicht lautlos — Apple lässt das nicht zu.)
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id:
        - sensor.<PREFIX>_timetable_changes_today
        - sensor.<PREFIX>_timetable_changes_tomorrow
  conditions:
    # The triggering entity varies between the two sensors, and neither
    # numeric_state nor state accepts a templated entity_id — so this is one of
    # the cases where a template condition is the correct tool rather than a
    # shortcut. Also ignores the restart-time transition out of unknown, which
    # would otherwise re-announce every change on every Home Assistant restart.
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable']
           and (trigger.to_state.state | int(0)) > 0 }}
  variables:
    tag_suffix: "{{ 'heute' if trigger.entity_id.endswith('today') else 'morgen' }}"
    when_word: "{{ 'Heute' if trigger.entity_id.endswith('today') else 'Morgen' }}"
    changes: "{{ state_attr(trigger.entity_id, 'changes') or [] }}"
  actions:
    - variables:
        body: >-
          {%- for change in changes %}
          {{ change.class_hour }}. Stunde {{ change.subject or 'Unterricht' }}
          {%- if change.is_cancelled %} fällt aus
          {%- else %} — Vertretung
          {%- if change.room %} in {{ change.room }}{% endif %}
          {%- if change.teachers %} bei {{ change.teachers | join(', ') }}{% endif %}
          {%- endif %}
          {% endfor -%}
    - parallel:
        - action: notify.mobile_app_iphone_16_von_enrique
          data: &planabweichung
            title: >-
              {{ when_word }}: {{ changes | count }}
              {{ 'Planänderung' if changes | count == 1 else 'Planänderungen' }}
            message: "{{ body | trim }}"
            data:
              push:
                # Silent, but still cuts through Focus / Do Not Disturb.
                interruption-level: time-sensitive
                sound: none
              tag: "schulmanager_changes_{{ tag_suffix }}"
              group: schulmanager-planabweichung
              notification_icon: mdi:calendar-alert
              url: /schulmanager/stundenplan
        - action: notify.mobile_app_ipad_air_m4_von_enrique
          data: *planabweichung
